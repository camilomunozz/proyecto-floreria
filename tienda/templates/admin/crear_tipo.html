{% extends 'admin/base_admin.html' %}

{% block content %}
<div class="container-fluid px-3 px-lg-4 py-4 d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm border-0 w-100" style="max-width: 500px; background-color: #F1EDD2;">
        <div class="card-header border-bottom py-3 px-4" style="background-color: #CBC6A4;">
            <h5 class="mb-0 fw-bold">Nuevo Tipo</h5>
            
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.help_text %}
                            <div class="form-text">{{ field.help_text }}</div>
                        {% endif %}
                        {% for error in field.errors %}
                            <div class="text-danger small mt-1">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}

                <div class="d-flex justify-content-between align-items-center mt-4">
                    <button type="button" class="btn btn-outline-secondary" onclick="window.history.back();">
                        <i class="bi bi-arrow-left"></i> Volver a Producto
                    <button type="submit" class="btn btn-success px-4">
                        Guardar Tipo
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
